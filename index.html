<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TallyHub</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A5CF83'/%3E%3Cpath d='M18 33 L28 43 L46 21' stroke='%231A1A19' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A5CF83'/%3E%3Cpath d='M18 33 L28 43 L46 21' stroke='%231A1A19' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#A5CF83">

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #FDFAF6;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      background: #FDFAF6;
      color: #435663;
      font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .mark {
      width: 84px; height: 84px;
      border-radius: 22px;
      background: #A5CF83;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 32px rgba(165, 207, 131, 0.4);
      animation: pop 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .mark svg { width: 52px; height: 52px; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    .label { font-size: 14px; font-weight: 600; letter-spacing: 0.3px; color: #435663; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(165, 207, 131, 0.25);
      border-top-color: #7EAE5C;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader">
    <div class="mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <path d="M18 33 L28 43 L46 21" stroke="#1A1A19" stroke-width="8" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="label">Loading TallyHub…</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwc66k62CTnCgGhu8ThEvbJF_vCdMNm18QKJBaY1VY_uDXl2PXISY5ZE8a6xIQNZv6J/exec"
    allow="fullscreen; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation allow-storage-access-by-user-activation">
  </iframe>

  <script>
    var iframe = document.getElementById('app');
    var loader = document.getElementById('loader');

    iframe.addEventListener('load', function () {
      setTimeout(function () { loader.classList.add('hide'); }, 300);
    });

    // Safety net: if the iframe never fires load, force-hide after 6s
    setTimeout(function () { loader.classList.add('hide'); }, 6000);
  </script>
</body>
</html>
